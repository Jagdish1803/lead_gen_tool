# Nginx reverse proxy → Next.js on localhost:3000
# Copy to /etc/nginx/sites-available/pitching-tool, then:
#   ln -s /etc/nginx/sites-available/pitching-tool /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Replace server_name with your domain (or the VPS IP for now).

server {
    listen 80;
    server_name your-domain.com;   # or 213.210.36.122

    # Allow the long-running pipeline requests + inbox reads.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# After this works over http, get free SSL with:
#   apt install certbot python3-certbot-nginx
#   certbot --nginx -d your-domain.com
# (certbot rewrites this file to add the 443 block automatically.)
